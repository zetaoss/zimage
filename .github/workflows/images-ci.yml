name: Images CI

on:
  pull_request:
    paths:
      - "zbase/**"
      - "zdev/**"
      - "versions.env"
      - "Makefile"
      - "hack/**"
      - ".github/scripts/**"
      - ".github/workflows/images-*.yml"

permissions:
  contents: read

concurrency:
  group: images-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve release plan
        id: release
        run: bash .github/scripts/release-plan.sh
      - name: Build zbase
        if: steps.release.outputs.release_zbase == 'true'
        run: make zbase
      - name: Build zdev
        if: steps.release.outputs.release_zdev == 'true'
        run: make zdev
      - name: Test zdev
        if: steps.release.outputs.release_zdev == 'true'
        run: make zdev-test
